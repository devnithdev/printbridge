<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PrintBridge: print to the office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --brand: #1E6FBF; --brand-dark: #123F73; --green: #21A67B;
    --bg: #f5f7fa; --card: #ffffff; --ink: #1f2933; --soft: #5b6775; --line: #e3e8ee;
    --field: #ffffff; --brand-text: #1E6FBF; --halo: rgba(30,111,191,.10);
    --ok: #15803d; --bad: #b91c1c; --warn-bg: #fff7ed; --warn: #7c3a06;
    --gold: #8f7036; --serif: 'Cormorant Garamond', Georgia, serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1419; --card: #171e26; --ink: #e6edf3; --soft: #9aa7b4; --line: #263241;
      --field: #0f1419; --brand-text: #6aa9ea; --halo: rgba(106,169,234,.14);
      --ok: #4ade80; --bad: #f87171; --warn-bg: #2a1d0f; --warn: #fbbf77; --gold: #d9c08a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1419; --card: #171e26; --ink: #e6edf3; --soft: #9aa7b4; --line: #263241;
    --field: #0f1419; --brand-text: #6aa9ea; --halo: rgba(106,169,234,.14);
    --ok: #4ade80; --bad: #f87171; --warn-bg: #2a1d0f; --warn: #fbbf77; --gold: #d9c08a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .theme {
    position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    display: grid; place-items: center; cursor: pointer; z-index: 5;
  }
  .theme:hover { border-color: var(--brand-text); }
  .theme svg { width: 18px; height: 18px; }
  .theme .moon { display: none; }
  :root[data-dark] .theme .sun { display: none; }
  :root[data-dark] .theme .moon { display: block; }

  main { flex: 1; display: grid; place-items: center; padding: 72px 16px 24px; }
  .card {
    width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 34px 28px 28px; position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px;
    background: linear-gradient(90deg, var(--brand) 0 80%, var(--green) 80%); }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
  .brand .mug { font-size: 26px; line-height: 1; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--soft); margin: 4px 0 22px; font-size: 15px; }
  label.f { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--field); color: var(--ink); font: inherit;
  }
  input:focus, select:focus { outline: 3px solid var(--halo); border-color: var(--brand-text); }
  #code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; font-size: 17px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--soft); margin-top: 10px; cursor: pointer; }
  .drop {
    display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 22px 14px;
    text-align: center; color: var(--soft); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--brand-text); background: var(--halo); }
  .drop b { color: var(--ink); display: block; word-break: break-all; }
  .drop input { display: none; }
  button.go {
    width: 100%; margin-top: 22px; padding: 14px; border: 0; border-radius: 12px;
    background: var(--brand); color: #fff; font: inherit; font-weight: 600; font-size: 16px; cursor: pointer;
  }
  button.go:hover { background: var(--brand-dark); }
  button.go:disabled { opacity: .6; cursor: default; }
  button.link { border: 0; background: none; color: var(--brand-text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; }
  .msg { margin: 14px 0 0; font-size: 14px; }
  .msg.bad { color: var(--bad); }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--soft); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--soft); }
  .dot.on { background: var(--ok); }
  .note { margin: 16px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }
  .hello { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .status { text-align: center; padding: 8px 0 4px; }
  .status .big { font-size: 40px; line-height: 1; margin-bottom: 10px; }
  .status h2 { font-size: 19px; margin: 0 0 6px; }
  .status p { color: var(--soft); margin: 0; font-size: 15px; }
  [hidden] { display: none !important; }
  footer { padding: 18px 16px 28px; text-align: center; }
  .egg { position: relative; display: inline-flex; align-items: center; cursor: default; user-select: none; -webkit-user-select: none; color: var(--gold); outline: none; }
  .egg .cup { font-size: 17px; line-height: 1; opacity: .6; transition: opacity .3s; }
  .egg b { position: absolute; left: 100%; top: 50%; margin-left: 12px; translate: -10px -50%; opacity: 0; white-space: nowrap; pointer-events: none;
    font: italic 400 1.05rem var(--serif); letter-spacing: .04em; color: var(--gold); transition: opacity .6s, translate .6s cubic-bezier(.2,.7,.2,1); }
  .egg:hover .cup, .egg:focus-visible .cup, .egg.on .cup { opacity: 1; }
  .egg:hover b, .egg:focus-visible b, .egg.on b { opacity: 1; translate: 0 -50%; }
  @media (max-width: 420px) { .card { padding: 30px 18px 22px; } }
</style>
</head>
<body>
<button class="theme" id="theme" type="button" aria-label="Switch between light and dark">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<main>
  <div class="card">
    <div class="brand"><span class="mug notranslate" translate="no" aria-hidden="true">☕️</span><h1>Print to the office</h1></div>

    <!-- 1. the code -->
    <form id="step-code" autocomplete="off">
      <p class="sub">Send a file to the office printers from anywhere. You need your personal PrintBridge code.</p>
      <label class="f" for="code">Your code</label>
      <input type="text" id="code" placeholder="PB-XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="characters" inputmode="text" maxlength="24" required>
      <label class="check"><input type="checkbox" id="remember"> Remember it on this device</label>
      <button class="go" type="submit" id="codeGo">Continue</button>
      <p class="msg bad" id="codeMsg" hidden></p>
    </form>

    <!-- 2. the file -->
    <form id="step-send" hidden>
      <div class="hello">
        <p class="sub" style="margin:4px 0 0">Hello <b id="who"></b></p>
        <span class="badge"><span class="dot" id="dot"></span><span id="online"></span></span>
      </div>
      <label class="f" for="printer">Printer</label>
      <select id="printer" required></select>
      <label class="f">File</label>
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.xlsm,.ppt,.pptx,.odt,.ods,.odp,.rtf,.txt,.csv,.png,.jpg,.jpeg,.gif,.bmp,.tif,.tiff,.webp">
        <span id="dropText">Choose a file, or drop it here<br><small>PDF, Word, Excel, PowerPoint, text or a picture, up to 20 MB</small></span>
      </label>
      <div class="row">
        <div><label class="f" for="copies">Copies</label><input type="number" id="copies" min="1" max="20" value="1"></div>
        <div><label class="f" for="color">Colour</label>
          <select id="color"><option value="monochrome">Black and white</option><option value="color">Colour</option></select></div>
      </div>
      <label class="check"><input type="checkbox" id="duplex"> Print on both sides</label>
      <button class="go" type="submit" id="sendGo">Send to the printer</button>
      <p class="msg bad" id="sendMsg" hidden></p>
      <p class="note" id="offline" hidden>The office computer is switched off right now. Your file waits safely and prints as soon as it's back on.</p>
      <p class="msg" style="color:var(--soft)"><span id="left"></span> <button type="button" class="link" id="notMe">Not you? Use another code</button></p>
    </form>

    <!-- 3. what happened -->
    <div id="step-done" hidden>
      <div class="status">
        <div class="big" id="stIcon">⏳</div>
        <h2 id="stTitle">Sending...</h2>
        <p id="stText"></p>
      </div>
      <button class="go" type="button" id="again">Send another file</button>
    </div>
  </div>
</main>

<footer>
  <span class="egg notranslate" id="egg" tabindex="0" role="note" aria-label="by @devnithdev" translate="no"><span class="cup" aria-hidden="true">☕️</span><b>by @devnithdev</b></span>
</footer>
<script src="/app.js"></script>
</body>
</html>
